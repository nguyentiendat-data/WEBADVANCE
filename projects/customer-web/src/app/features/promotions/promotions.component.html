<nav class="crumbs" aria-label="Đường dẫn">
  <ol class="container">
    <li><a routerLink="/">Trang chủ</a></li>
    <li><app-icon name="lucide:chevron-right" [size]="14" /></li>
    <li aria-current="page">Khuyến mãi</li>
  </ol>
</nav>

@if (flashSale(); as sale) {
  <section class="hero" [attr.aria-label]="sale.promotion.name">
    <h1 class="hero__title">
      <span class="hero__flash"><app-icon name="lucide:zap" [size]="40" /> FLASH SALE</span>
      HÔM NAY
    </h1>
    <p class="hero__sub">
      @if (maxDiscount() > 0) {
        Ưu đãi lên tới {{ maxDiscount() }}% cho các sản phẩm nội thất cao cấp - Nhanh tay kẻo lỡ
      } @else {
        {{ sale.promotion.name }} - Nhanh tay kẻo lỡ
      }
    </p>
    <app-countdown size="large" [endDate]="sale.promotion.endDate" />
  </section>
}

<app-product-list class="list" [embedded]="true" heading="Khuyến mãi" [onlyPromotion]="true" />
