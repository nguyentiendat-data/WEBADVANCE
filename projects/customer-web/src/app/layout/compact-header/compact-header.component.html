<header class="bar">

    <app-icon name="lucide:chevron-left" [size]="26" />
  </button>

  <a class="logo" routerLink="/" aria-label="CaraVeso - Trang chủ">CaraVeso</a>

  <nav class="icons" aria-label="Tài khoản">
    <a class="icon-btn" routerLink="/wishlist" aria-label="Yêu thích">
      <app-icon name="lucide:heart" [size]="22" />
    </a>
    <a class="icon-btn" routerLink="/account" aria-label="Tài khoản">
      <app-icon name="lucide:user" [size]="22" />
    </a>
    <a class="icon-btn" routerLink="/cart" aria-label="Giỏ hàng">
      <app-icon name="lucide:shopping-cart" [size]="22" />
    </a>
